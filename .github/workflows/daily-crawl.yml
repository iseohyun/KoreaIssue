name: Daily Media Script & Issue Summary Crawler

on:
  schedule:
    # 매일 한국시간(KST) 오전 07:00 및 오후 19:00 (UTC 22:00, 10:00) 자동 실행
    - cron: '0 22,10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run raw script collection & issue summary pipeline
        run: npm run pipeline

      - name: Commit and push updated issue summary if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "변경된 이슈 스냅샷이 없습니다."
          else
            git commit -m "chore(data): auto-crawl media scripts & update issue summary [$(date -u +'%Y-%m-%d')]"
            git push
          fi
